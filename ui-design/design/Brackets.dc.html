<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brackets — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.t-light{--bg:#F3F4F1;--surface:#FFFFFF;--surface2:#ECEEEA;--ink:#11151B;--ink2:#3F4752;--ink3:#5F6774;--line:#CDD1CC;--line2:#DCDFDB;--accent:#1D4ED8;--accent-ink:#FFFFFF;--accent-soft:#E7EDFD;--live:#D92D20;--win:#137A47;--win-soft:#E2F2E9;--shadow:0 1px 2px rgba(17,21,27,.06),0 6px 16px rgba(17,21,27,.05)}
.t-dark{--bg:#0D1015;--surface:#161A21;--surface2:#222832;--ink:#F1F3F6;--ink2:#C2C9D3;--ink3:#8F98A5;--line:#3A414D;--line2:#2A303B;--accent:#7C9BFF;--accent-ink:#0D1015;--accent-soft:#1C2648;--live:#FF5B4A;--win:#4CC98A;--win-soft:#14301F;--shadow:0 1px 2px rgba(0,0,0,.5)}
.app{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4}
.d{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--ink);border-radius:12px;padding:0}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--live);font:700 11px Inter,sans-serif;letter-spacing:.08em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 55%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion: reduce){.live i{animation:none}}
.node{position:absolute;width:236px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);box-sizing:border-box}
.nh{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;font:600 14px 'Barlow Condensed',sans-serif;color:var(--ink3);border-bottom:1px solid var(--line2);letter-spacing:.02em}
.nr{display:flex;align-items:center;gap:8px;padding:0 10px;height:38px;font-size:14px}
.ns{font:700 20px 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.rd{flex:1;height:44px;border:0;background:transparent;color:var(--ink3);font:600 14px Inter,sans-serif;border-bottom:2px solid transparent}
.rd.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.cn{position:absolute;box-sizing:border-box}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;color:var(--ink3);font-size:11px;font-weight:600;text-decoration:none}
.tab.on{color:var(--accent)}
</style>
</helmet>
<div style="display: flex; gap: 80px; align-items: flex-start; font-family: Inter, system-ui, sans-serif">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 12px; width: 390px">
<div style="font-size: 13px; font-weight: 600; color: #5F6774">{{th.label}} · 390 · Sunday 10:52 · swipe between rounds</div>
<div class="app {{th.cls}}" style="width: 390px; border-radius: 28px; overflow: hidden; border: 1px solid #C9CDC8; display: flex; flex-direction: column">

<header style="background: var(--surface); display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 2px; padding: 8px 8px 4px 16px">
<h1 style="margin: 0; flex: 1; font-size: 24px; font-weight: 700">Brackets</h1>
<span style="font-size: 12px; color: var(--ink3); display: flex; align-items: center; gap: 6px; padding-right: 4px"><span class="dot" style="width: 6px; height: 6px; background: var(--win)"></span>Updated 1m ago</span>
<button class="ib" aria-label="Search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
</div>
<div role="tablist" aria-label="Board" style="display: flex; margin: 4px 16px 8px; padding: 4px; border-radius: 12px; background: var(--surface2); gap: 4px">
<button role="tab" aria-selected="true" style="flex: 1; height: 38px; border: 0; border-radius: 9px; background: var(--surface); color: var(--ink); font: 700 14px Inter, sans-serif; box-shadow: var(--shadow)">1st–8th</button>
<button role="tab" aria-selected="false" style="flex: 1; height: 38px; border: 0; border-radius: 9px; background: transparent; color: var(--ink2); font: 600 14px Inter, sans-serif">9th–16th</button>
<button role="tab" aria-selected="false" style="flex: 1; height: 38px; border: 0; border-radius: 9px; background: transparent; color: var(--ink2); font: 600 14px Inter, sans-serif">Standings</button>
</div>
<nav aria-label="Rounds" style="display: flex; padding: 0 8px; border-bottom: 1px solid var(--line2)">
<button class="rd">Crossover</button><button class="rd on" aria-current="true">QF</button><button class="rd">SF</button><button class="rd">Final</button><button class="rd">5th–8th</button>
</nav>
</header>

<div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px 4px">
<button style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font: 700 13px Inter, sans-serif"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Leeds 1 path</button>
<button style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink2); font: 600 13px Inter, sans-serif">Pick team</button>
<span style="flex: 1"></span>
<a href="#" style="display: inline-flex; align-items: center; height: 36px; padding: 0 4px; color: var(--ink2); font-size: 13px; font-weight: 600; text-decoration: none">What-if</a>
</div>

<div style="display: flex; padding: 8px 16px 0; gap: 40px">
<span class="lbl" style="width: 236px">Quarter-finals · 28 min</span><span class="lbl" style="white-space: nowrap">Semis</span>
</div>

<div style="position: relative; height: 508px; overflow: hidden; margin-top: 8px">
<sc-for list="{{nodes}}" as="n" hint-placeholder-count="6">
<div class="node" style="left: {{n.x}}; top: {{n.y}}; opacity: {{n.op}}; border: {{n.bd}}; box-shadow: {{n.sh}}">
<div class="nh"><span>{{n.when}}</span><span style="flex: 1"></span><span class="d" style="font-size: 13px">{{n.code}}</span><sc-if value="{{n.live}}" hint-placeholder-val="{{ false }}"><span class="live"><i></i>LIVE</span></sc-if></div>
<sc-for list="{{n.rows}}" as="r" hint-placeholder-count="2">
<div class="nr" style="border-top: 1px solid {{r.sep}}; height: {{r.h}}">
<span class="dot" style="background: {{r.c}}; border: {{r.ring}}; box-sizing: border-box"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2">
<span style="font-weight: {{r.fw}}; font-style: {{r.fs}}; color: {{r.col}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.n}}</span>
<span style="font-size: 11px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
</span>
<span class="ns">{{r.s}}</span>
</div>
</sc-for>
</div>
</sc-for>
<div class="cn" style="left: 252px; top: 52px; width: 20px; height: 128px; border: 2px solid var(--line); border-left: 0; border-radius: 0 10px 10px 0"></div>
<div class="cn" style="left: 252px; top: 52px; width: 20px; height: 66px; border-top: 2.5px solid var(--accent); border-right: 2.5px solid var(--accent); border-radius: 0 10px 0 0"></div>
<div class="cn" style="left: 271px; top: 116px; width: 21px; border-top: 2.5px dashed var(--accent)"></div>
<div class="cn" style="left: 252px; top: 308px; width: 20px; height: 128px; border: 2px solid var(--line); border-left: 0; border-radius: 0 10px 10px 0; opacity: .5"></div>
<div class="cn" style="left: 271px; top: 372px; width: 21px; border-top: 2px solid var(--line); opacity: .5"></div>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 0 14px">
<span style="width: 6px; height: 6px; border-radius: 50%; background: var(--line)"></span><span style="width: 18px; height: 6px; border-radius: 3px; background: var(--ink)"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--line)"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--line)"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--line)"></span>
</div>

<section style="margin: 0 16px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center"><span class="lbl" style="flex: 1">Crossovers · final</span><span style="font-size: 12px; color: var(--ink3)">Losers → 9th–16th</span></div>
<div style="background: var(--surface); border: 1px solid var(--line2); border-radius: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
<sc-for list="{{xo}}" as="x" hint-placeholder-count="4">
<div style="padding: 8px 12px; border-top: 1px solid {{x.st}}; border-left: 1px solid {{x.sl}}; display: flex; flex-direction: column; gap: 1px; font-size: 13px">
<span class="d" style="font-size: 12px; color: var(--ink3); font-weight: 600">{{x.code}}</span>
<span style="display: flex; gap: 6px; font-weight: 700"><span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.w}}</span><span class="d" style="font-size: 16px">{{x.ws}}</span></span>
<span style="display: flex; gap: 6px; color: var(--ink3)"><span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.l}}</span><span class="d" style="font-size: 16px; font-weight: 700">{{x.ls}}</span></span>
</div>
</sc-for>
</div>
</section>

<nav aria-label="Main" style="display: flex; background: var(--surface); border-top: 1px solid var(--line2); padding: 4px 4px 18px">
<a class="tab" href="Main.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/></svg>Now</a>
<a class="tab" href="Schedule.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</a>
<a class="tab" href="Team.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>Teams</a>
<a class="tab" href="Pools.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11"/></svg>Pools</a>
<a class="tab on" href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h5v5M3 19h5v-5M8 10v4h5M13 7h4v10h-4M17 12h4"/></svg>Brackets</a>
</nav>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"show":{"editor":"enum","options":["both","light","dark"],"default":"both"},"highlight":{"editor":"boolean","default":true},"$preview":{"width":860,"height":1180}}'>
class Component extends DCLogic {
renderVals() {
const C = { lboro: '#7C4DDB', leeds: '#1F7AE0', shef: '#E0452B', notts: '#12A06A', york: '#D39B0B' };
const hl = this.props.highlight ?? true;
const r = (n, c, s, k, sub) => ({ n, c: c ? C[c] : 'transparent', ring: c ? 'none' : '1.5px dashed var(--ink3)', s: s === undefined ? '' : s, sub: sub || '', fw: k === 'w' ? 700 : k === 'p' ? 500 : 500, fs: k === 'p' ? 'italic' : 'normal', col: k === 'l' ? 'var(--ink3)' : k === 'p' ? 'var(--ink2)' : 'var(--ink)', h: sub ? '46px' : '38px' });
const node = (x, y, when, code, live, rows, state) => {
rows.forEach((row, i) => { row.sep = i === 0 ? 'transparent' : 'var(--line2)'; });
const on = state === 'on', pos = state === 'possible', dim = hl && state === 'dim';
return { x, y, when, code, live, rows, op: dim ? 0.42 : 1,
bd: hl && on ? '1.5px solid var(--accent)' : hl && pos ? '1.5px dashed var(--accent)' : '1px solid var(--line2)',
sh: hl && on ? '0 0 0 3px var(--accent-soft), var(--shadow)' : 'var(--shadow)' };
};
const nodes = [
node('16px', '0px', 'SUN 10:40 · P1', '1v8', true, [r('Leeds 1', 'leeds', 6, 'w'), r('Loughborough 3', 'lboro', 4)], 'on'),
node('16px', '128px', 'SUN 10:40 · P2', '4v5', true, [r('Nottingham 1', 'notts', 5), r('York 1', 'york', 5)], 'dim'),
node('16px', '256px', 'SUN 10:40 · P3', '2v7', true, [r('Loughborough 1', 'lboro', 7, 'w'), r('Sheffield 2', 'shef', 5)], 'dim'),
node('16px', '384px', 'SUN 11:15 · P1', '3v6', false, [r('Sheffield 1', 'shef'), r('Loughborough 2', 'lboro')], 'dim'),
node('292px', '56px', 'SUN 12:25 · P1', 'SF', false, [r('Winner 1v8', '', '', 'p', 'Leeds 1 or Loughborough 3'), r('Winner 4v5', '', '', 'p', 'Nottingham 1 or York 1')], 'possible'),
node('292px', '312px', 'SUN 12:25 · P2', 'SF', false, [r('Winner 2v7', '', '', 'p', 'Loughborough 1 or Sheffield 2'), r('Winner 3v6', '', '', 'p', 'Sheffield 1 or Loughborough 2')], 'dim')
];
const show = this.props.show ?? 'both';
const all = [{ cls: 't-light', label: 'Light' }, { cls: 't-dark', label: 'Dark' }];
const xo = [
{ code: '8v9', w: 'Loughborough 3', ws: 10, l: 'Loughborough 4', ls: 8 },
{ code: '5v12', w: 'York 1', ws: 9, l: 'Leeds 2', ls: 6 },
{ code: '7v10', w: 'Sheffield 2', ws: 11, l: 'Nottingham 2', ls: 7 },
{ code: '6v11', w: 'Loughborough 2', ws: 12, l: 'Sheffield 3', ls: 10 }
].map((x, i) => Object.assign(x, { st: i < 2 ? 'transparent' : 'var(--line2)', sl: i % 2 === 0 ? 'transparent' : 'var(--line2)' }));
return { themes: show === 'light' ? [all[0]] : show === 'dark' ? [all[1]] : all, nodes, xo };
}
}
</script>
</body>
</html>
